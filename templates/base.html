<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <link rel="stylesheet" href="{{ stylesheet_href }}">
</head>
<body>
    <div class="page-shell">
        <header class="site-header">
            <a class="site-brand" href="{{ navigation[0].href if navigation else 'index.html' }}">My SSG</a>
            <nav class="site-nav" aria-label="Main navigation">
                {% for item in navigation %}
                <a class="nav-link{% if item.is_current %} is-current{% endif %}" href="{{ item.href }}">{{ item.title }}</a>
                {% endfor %}
            </nav>
        </header>
        <main class="site-content">
            {{ content | safe }}
        </main>
    </div>
</body>
</html>
